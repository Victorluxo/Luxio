      - name: Corrigir compatibilidade Java/Kotlin
        working-directory: luxio-build
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Compilar Luxio
        working-directory: luxio-build
        run: gradle :app:assembleDebug --no-daemon

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto Luxio
        run: |
          unzip -o LuxioAndroid_v2_GitHubActions.zip -d luxio-build

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar Luxio
        working-directory: luxio-build
        run: gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Luxio-APK
          path: luxio-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
